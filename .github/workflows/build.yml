name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# A pushed tag v* also makes a GitHub release: signed NSIS installer + .sig + latest.json.
# It's created as a draft and only published after the smoke job passes, so a broken
# build never reaches the in-app updater. Tags with a '-' (v0.2.0-rc.1) are pre-releases,
# which GitHub never treats as "latest", so the updater ignores them; plain tags
# (v0.2.1) are full releases and the app offers them.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          # Empty on branch pushes: build only, no release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: PS5 Viewer ${{ github.ref_name }}
          releaseBody: Install the PS5.Viewer setup .exe. Installed copies offer full releases in-app.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-viewer-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/ps5-viewer.exe

  # Smoke test on a real Windows box: does the built app start, open its window and stay up?
  # There's no capture card on the runner, so the app should sit on NO DEVICE; that's fine.
  smoke:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps5-viewer-windows
          path: dist
      - name: Launch, wait, check the window
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter ps5-viewer.exe | Select-Object -First 1
          if (-not $exe) { throw "ps5-viewer.exe not in the artifact" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "app exited after start, code $($p.ExitCode)" }
          $title = (Get-Process -Id $p.Id).MainWindowTitle
          "pid $($p.Id), window title '$title', working set $([math]::Round($p.WorkingSet64/1MB)) MB"
          $wv = Get-Process msedgewebview2 -ErrorAction SilentlyContinue
          "WebView2 processes: $(@($wv).Count)"
          if (@($wv).Count -eq 0) { throw "no WebView2 process: the page never loaded" }
          if ($title -ne 'PS5') { Write-Warning "window title is '$title', expected 'PS5' (may be empty without a desktop session)" }
      - name: Screenshot
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\smoke.png")
      - name: Stop the app
        if: always()
        shell: pwsh
        run: Get-Process ps5-viewer -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps5-viewer-smoke
          path: smoke.png
          if-no-files-found: warn

  # Tags only: publish the draft release once the smoke test has passed.
  release:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets,isPrerelease,url \
            --jq '"\(.url) prerelease=\(.isPrerelease)", (.assets[].name)'
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx latest.json
