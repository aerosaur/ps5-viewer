<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PS5 window — TE in 30th-anniversary greys</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap"
          rel="stylesheet"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #303136;
          }
          a:hover {
            color: #16171a;
          }
          button {
            font-family: inherit;
            cursor: pointer;
            padding: 0;
          }
        </style>
      </helmet>
      <div
        style="
          width: 1040px;
          height: 790px;
          box-sizing: border-box;
          background: #a0a1a5;
          font-family: &quot;IBM Plex Mono&quot;, ui-monospace, monospace;
          color: #16171a;
          position: relative;
          overflow: hidden;
        "
      >
        <sc-if value="{{shown}}" hint-placeholder-val="{{ true }}">
          <div
            style="
              width: 1040px;
              height: 790px;
              box-sizing: border-box;
              padding: 20px;
              display: flex;
              flex-direction: column;
              gap: 16px;
            "
          >
            <div
              style="
                height: 44px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
              "
            >
              <div style="display: flex; align-items: center; gap: 20px">
                <div aria-hidden="true" style="display: flex; gap: 3px; margin-right: -4px">
                  <div style="width: 6px; height: 18px; background: #d7261e"></div>
                  <div style="width: 6px; height: 18px; background: #f2b600"></div>
                  <div style="width: 6px; height: 18px; background: #1e9a57"></div>
                  <div style="width: 6px; height: 18px; background: #1f5fbf"></div>
                </div>
                <div style="font-weight: 600">PS5</div>
                <div style="color: #303136">IN 01 / CAM LINK 4K</div>
                <div style="color: #303136">HDMI → USB</div>
              </div>
              <div style="display: flex; align-items: center; gap: 4px">
                <button
                  aria-label="Minimise"
                  style="
                    width: 44px;
                    height: 44px;
                    border: 0;
                    background: transparent;
                    font-size: 14px;
                    color: #16171a;
                  "
                >
                  _
                </button>
                <button
                  aria-label="Close"
                  style="
                    width: 44px;
                    height: 44px;
                    border: 0;
                    background: transparent;
                    font-size: 14px;
                    color: #16171a;
                  "
                >
                  ×
                </button>
              </div>
            </div>

            <div
              style="
                width: 1000px;
                height: 562px;
                box-sizing: border-box;
                background: #0b0b0b;
                border: 2px solid #2b2c30;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
              "
            >
              <div
                style="
                  position: absolute;
                  left: 12px;
                  top: 10px;
                  font-size: 10px;
                  letter-spacing: 0.1em;
                  color: #8e8e8a;
                "
              >
                01
              </div>
              <div
                style="
                  font-size: 12px;
                  letter-spacing: 0.14em;
                  text-transform: uppercase;
                  color: #8e8e8a;
                "
              >
                PS5 picture
              </div>
            </div>

            <div
              style="
                height: 112px;
                box-sizing: border-box;
                background: #b4b5b9;
                border: 1px solid #8c8d92;
                border-radius: 4px;
                padding: 0 20px;
                display: flex;
                align-items: center;
                gap: 28px;
              "
            >
              <div
                style="
                  width: 220px;
                  height: 76px;
                  box-sizing: border-box;
                  background: #000000;
                  border-radius: 3px;
                  padding: 10px 14px;
                  display: flex;
                  flex-direction: column;
                  justify-content: space-between;
                  color: #ffffff;
                "
              >
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    font-size: 10px;
                    letter-spacing: 0.12em;
                    color: #a8a8a4;
                  "
                >
                  <span>VOL</span><span>1080P · 60</span>
                </div>
                <div
                  style="font-size: 30px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; color: {{numColor}}"
                >
                  {{volLabel}}
                </div>
              </div>

              <div style="display: flex; align-items: center; gap: 14px">
                <button
                  aria-label="Volume down"
                  onClick="{{down}}"
                  style="
                    width: 44px;
                    height: 44px;
                    border-radius: 4px;
                    border: 1px solid #9a9ba0;
                    background: #d0d1d4;
                    box-shadow: 0 2px 0 #9a9ba0;
                    font-size: 18px;
                    color: #16171a;
                  "
                >
                  −
                </button>
                <div style="position: relative; width: 92px; height: 92px">
                  <div
                    aria-hidden="true"
                    style="
                      position: absolute;
                      inset: 0;
                      border-radius: 50%;
                      background: repeating-conic-gradient(
                        from -135deg,
                        #2b2c30 0deg 1.2deg,
                        transparent 1.2deg 13.5deg
                      );
                      -webkit-mask: radial-gradient(
                        circle,
                        transparent 40px,
                        #000 40.5px
                      );
                      mask: radial-gradient(
                        circle,
                        transparent 40px,
                        #000 40.5px
                      );
                    "
                  ></div>
                  <div
                    style="
                      position: absolute;
                      left: 10px;
                      top: 10px;
                      width: 72px;
                      height: 72px;
                      border-radius: 50%;
                      background: radial-gradient(
                        circle,
                        #46474c 0,
                        #46474c 24px,
                        #2f3034 25px,
                        #2f3034 29px,
                        #3b3c40 30px
                      );
                      box-shadow:
                        0 3px 0 #26272a,
                        0 8px 14px rgba(0, 0, 0, 0.18);
                    "
                  >
                    <div
                      style="position: absolute; inset: 0; transform: rotate({{angle}}deg)"
                    >
                      <div
                        style="
                          position: absolute;
                          left: 34px;
                          top: 5px;
                          width: 4px;
                          height: 13px;
                          border-radius: 2px;
                          background: #d0d1d4;
                        "
                      ></div>
                    </div>
                  </div>
                </div>
                <button
                  aria-label="Volume up"
                  onClick="{{up}}"
                  style="
                    width: 44px;
                    height: 44px;
                    border-radius: 4px;
                    border: 1px solid #9a9ba0;
                    background: #d0d1d4;
                    box-shadow: 0 2px 0 #9a9ba0;
                    font-size: 18px;
                    color: #16171a;
                  "
                >
                  +
                </button>
              </div>

              <div style="margin-left: auto; display: flex; gap: 12px">
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <div
                    style="
                      font-size: 10px;
                      letter-spacing: 0.1em;
                      color: #303136;
                    "
                  >
                    01 MUTE
                  </div>
                  <button
                    aria-label="Mute"
                    onClick="{{toggleMute}}"
                    style="width: 56px; height: 56px; border-radius: 4px; border: 1px solid #3F4044; background: #55565B; box-shadow: 0 {{muteDrop}}px 0 #3F4044; transform: translateY({{mutePress}}px); display: flex; align-items: center; justify-content: center"
                  >
                    <svg
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="#FF8A8F"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M11 5 6 9H2v6h4l5 4z"></path>
                      <path d="m22 9-6 6"></path>
                      <path d="m16 9 6 6"></path>
                    </svg>
                  </button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <div
                    style="
                      font-size: 10px;
                      letter-spacing: 0.1em;
                      color: #303136;
                    "
                  >
                    02 MINI
                  </div>
                  <button
                    aria-label="Mini window"
                    style="
                      width: 56px;
                      height: 56px;
                      border-radius: 4px;
                      border: 1px solid #3f4044;
                      background: #55565b;
                      box-shadow: 0 2px 0 #3f4044;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <svg
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="#F4A6D8"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <rect x="3" y="4" width="18" height="16" rx="1"></rect>
                      <rect x="12" y="12" width="6" height="5"></rect>
                    </svg>
                  </button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <div
                    style="
                      font-size: 10px;
                      letter-spacing: 0.1em;
                      color: #303136;
                    "
                  >
                    03 FULL
                  </div>
                  <button
                    aria-label="Fullscreen"
                    style="
                      width: 56px;
                      height: 56px;
                      border-radius: 4px;
                      border: 1px solid #3f4044;
                      background: #55565b;
                      box-shadow: 0 2px 0 #3f4044;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <svg
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="#8FB0FF"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M8 3H3v5"></path>
                      <path d="M21 8V3h-5"></path>
                      <path d="M3 16v5h5"></path>
                      <path d="M16 21h5v-5"></path>
                    </svg>
                  </button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <div
                    style="
                      font-size: 10px;
                      letter-spacing: 0.1em;
                      color: #303136;
                    "
                  >
                    04 HIDE
                  </div>
                  <button
                    aria-label="Hide controls"
                    onClick="{{hide}}"
                    style="
                      width: 56px;
                      height: 56px;
                      border-radius: 4px;
                      border: 1px solid #3f4044;
                      background: #55565b;
                      box-shadow: 0 2px 0 #3f4044;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                    "
                  >
                    <svg
                      width="22"
                      height="22"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="#5FD6B8"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path
                        d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"
                      ></path>
                      <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                      <path
                        d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"
                      ></path>
                      <path d="m2 2 20 20"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
          <div
            style="
              width: 1040px;
              height: 790px;
              box-sizing: border-box;
              background: #0b0b0b;
              display: flex;
              align-items: center;
              justify-content: center;
              position: relative;
            "
          >
            <div
              style="
                font-size: 12px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #8e8e8a;
              "
            >
              PS5 picture — controls hidden
            </div>
            <div
              style="
                position: absolute;
                left: 20px;
                bottom: 26px;
                font-size: 10px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #8e8e8a;
              "
            >
              H · show controls
            </div>
            <button
              aria-label="Show controls"
              onClick="{{show}}"
              style="
                position: absolute;
                right: 16px;
                bottom: 16px;
                width: 44px;
                height: 44px;
                border-radius: 4px;
                border: 1px solid #3f4044;
                background: #55565b;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#5FD6B8"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                ></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </sc-if>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"$preview":{"width":1040,"height":790}}'
    >
      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { vol: 60, muted: false, hidden: false };
        }
        renderVals() {
          const vol = this.state.vol;
          const muted = this.state.muted;
          const hidden = this.state.hidden;
          return {
            shown: !hidden,
            hidden: hidden,
            angle: -135 + vol * 2.7,
            volLabel: muted ? 'MUTE' : String(vol).padStart(3, '0'),
            numColor: muted ? '#FF8A8F' : '#FFFFFF',
            muteDrop: muted ? 0 : 2,
            mutePress: muted ? 2 : 0,
            down: () => this.setState({ vol: Math.max(0, vol - 5) }),
            up: () => this.setState({ vol: Math.min(100, vol + 5) }),
            toggleMute: () => this.setState({ muted: !muted }),
            hide: () => this.setState({ hidden: true }),
            show: () => this.setState({ hidden: false })
          };
        }
      }
    </script>
  </body>
</html>
